name: Bug Report
description: Report a problem with the site, its build or its automation
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page
      description: The URL of the page, or the workflow or script concerned.
      placeholder: "https://goabonga.github.io/blog/"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Name and version, if the bug is on the published site.
      placeholder: "Firefox 140"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs or error output.
      render: shell
