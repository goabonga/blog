name: Content
description: Report an error, an outdated statement or a typo in a post or a page
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us keep the content correct!

  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Incorrect statement
        - Outdated content
        - Unclear explanation
        - Broken link
        - Typo
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: The URL of the post or page, and the section if relevant.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be changed?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix
      description: If you have a suggestion for the correct content, describe it here.
