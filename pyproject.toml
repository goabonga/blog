[project]
name = "blog"
version = "0.0.0"
description = "Personal blog of goabonga, built with Zensical."
readme = "README.md"
authors = [
    { name = "Chris", email = "goabonga@pm.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://github.com/goabonga/blog"
Repository = "https://github.com/goabonga/blog"
Issues = "https://github.com/goabonga/blog/issues"

# The repository is a site, not a package: nothing is built or installed.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "multicz>=1.9",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
docs = [
    "zensical>=0.0.73",
]
# Branding-asset tooling, isolated from `dev` and `docs` so neither the
# quality pipeline nor the docs build drags a native cairo stack in.
# Only `scripts/regen-icons.sh` installs it, on demand, via
# `uv run --only-group favicon`.
favicon = [
    "cairosvg>=2.7",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The CI helper scripts build markdown and HTML summaries from long
# literals; the formatter already wraps everything it can.
"scripts/**.py" = ["E501"]
# Inline XML and TOML fixtures for the summary and dependabot scripts.
"tests/test_format_summary.py" = ["E501"]
"tests/test_rewrite_dependabot_commit.py" = ["E501"]

# The scripts drive git and the GitHub API through argument lists, never a
# shell, so the subprocess findings (B404, B603, B607) describe how they
# work. The XML they parse (B314, and its import B405) is the JUnit and
# coverage report that the CI job has just written itself.
[tool.bandit]
skips = ["B314", "B404", "B405", "B603", "B607"]
